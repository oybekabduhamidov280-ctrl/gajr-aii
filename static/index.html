
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b14">
  <title>Gajr AI</title>
  <link rel="icon" href="/logo.png">

  <style>
    :root {
      color-scheme: dark;
      --bg: #090b14;
      --text: #f4f5ff;
      --muted: #a1a8c3;
      --border: rgba(151, 139, 255, .19);
      --accent: #8b5cf6;
      --danger: #fb4774;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 10% 0%, rgba(106,59,230,.19), transparent 42%),
        radial-gradient(ellipse at 95% 95%, rgba(40,104,220,.13), transparent 38%),
        #090b14;
      color: var(--text);
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 1000px;
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 18px;
      gap: 14px;
      isolation: isolate;
    }

    .top {
      background: linear-gradient(120deg, #6f3de7, #4140bf 55%, #235bae);
      color: white;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 23px;
      padding: 17px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 12px 40px rgba(83,57,210,.22);
    }

    .brand, .creator {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand h1 {
      margin: 0;
      font-size: 23px;
      font-weight: 800;
    }

    .brand p {
      margin: 4px 0 0;
      font-size: 12px;
      color: rgba(255,255,255,.83);
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: 15px;
      object-fit: contain;
      background: white;
      padding: 4px;
    }

    .creator {
      text-align: right;
      flex-shrink: 0;
    }

    .creator .who { font-size: 12px; }
    .creator .who b { display: block; font-size: 14px; }

    .photo {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid white;
    }

    .opts {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    select, .chip {
      min-height: 42px;
      background: rgba(20,24,42,.88);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 9px 15px;
      font-size: 13px;
      cursor: pointer;
    }

    .chip.on {
      background: linear-gradient(135deg, #8052f5, #5945dc);
      color: white;
      border-color: rgba(190,170,255,.6);
    }

    /* Kutib olish oynasi */
    #log {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      background: rgba(16,19,34,.76);
      border: 1px solid var(--border);
      border-radius: 23px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 19px;
      box-shadow: 0 18px 55px rgba(0,0,0,.19);
      scrollbar-width: thin;
      scrollbar-color: #51428c transparent;
    }

    .welcome-screen {
      flex: 1;
      min-height: 330px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px 12px;
      animation: welcomeFade .8s ease both;
      background: radial-gradient(
        ellipse at 50% 35%,
        rgba(120,65,210,.17),
        transparent 65%
      );
    }

    .galaxy-image {
      width: 112px;
      height: 112px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 24px;
      border: 2px solid rgba(200,155,255,.8);
      box-shadow:
        0 0 16px rgba(173,82,255,.8),
        0 0 38px rgba(110,65,240,.45);
      animation: galaxyFloat 4s ease-in-out infinite;
    }

    .welcome-screen h2 {
      margin: 0 0 12px;
      font-size: clamp(23px,3.5vw,34px);
      line-height: 1.25;
      letter-spacing: -.8px;
      color: #f6f3ff;
    }

    .welcome-screen p {
      max-width: 540px;
      margin: 0;
      font-size: 14px;
      line-height: 1.8;
      color: #aeb4ce;
    }

    .welcome-tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 9px;
      margin-top: 24px;
    }

    .welcome-tags span {
      padding: 9px 14px;
      border: 1px solid var(--border);
      border-radius: 18px;
      color: #ded5ff;
      background: rgba(91,64,155,.15);
      font-size: 12px;
    }

    .line {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      animation: messageAppear .3s ease both;
    }

    .line.me { justify-content: flex-end; }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      border: 2px solid rgba(153,130,255,.28);
    }

    .msg {
      max-width: 78%;
      padding: 12px 16px;
      border-radius: 19px;
      line-height: 1.65;
      font-size: 15px;
      overflow-wrap: anywhere;
    }

    .me .msg {
      background: linear-gradient(135deg,#8051f5,#5d43dc);
      color: white;
      border-bottom-right-radius: 5px;
    }

    .ai .msg {
      background: linear-gradient(145deg,rgba(38,43,71,.98),rgba(27,31,53,.98));
      border: 1px solid rgba(151,139,255,.13);
      border-bottom-left-radius: 5px;
    }

    .msg strong { color: #c4b5fd; }
    .typing .msg { color: #b8a6ff; font-style: italic; }

    #status {
      min-height: 20px;
      font-size: 13px;
      color: var(--muted);
      padding: 0 10px;
    }

    #status.live { color: #ff7797; font-weight: 600; }

    #row {
      display: flex;
      gap: 11px;
      align-items: center;
      padding: 8px;
      border-radius: 25px;
      background: rgba(20,24,42,.8);
      border: 1px solid var(--border);
    }

    #text {
      flex: 1;
      min-width: 0;
      padding: 14px 17px;
      font-size: 15px;
      border-radius: 17px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      outline: none;
    }

    #text::placeholder { color: #858ca9; }

    .btn {
      border: none;
      border-radius: 50%;
      width: 46px;
      height: 46px;
      font-size: 18px;
      cursor: pointer;
      background: linear-gradient(140deg,#8b5cf6,#5845db);
      color: white;
      flex-shrink: 0;
    }

    .btn.rec {
      background: var(--danger);
      animation: pulse 1.2s infinite;
    }

    @keyframes galaxyFloat {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    @keyframes welcomeFade {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes messageAppear {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(251,71,116,.5); }
      100% { box-shadow: 0 0 0 14px rgba(251,71,116,0); }
    }

    @media (max-width:600px) {
      .app { padding: 10px; gap: 10px; }
      .top { padding: 12px; }
      .logo { width: 40px; height: 40px; }
      .brand { gap: 8px; }
      .brand h1 { font-size: 19px; }
      .brand p { font-size: 10px; }
      .photo { width: 40px; height: 40px; }
      .creator { gap: 5px; }
      .creator .who { display: none; }
      .opts { gap: 6px; }
      select, .chip { padding: 8px; font-size: 12px; }
      #log { padding: 12px; }
      .welcome-screen { min-height: 280px; }
      .galaxy-image { width: 88px; height: 88px; }
      .welcome-tags { gap: 6px; margin-top: 18px; }
      .msg { max-width: 100%; padding: 10px 12px; font-size: 14px; }
      #row { gap: 5px; padding: 5px; }
      #text { padding: 12px 8px; font-size: 14px; }
      .btn { width: 40px; height: 40px; font-size: 16px; }
    }

    @media (prefers-reduced-motion:reduce) {
      *,*::before,*::after {
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        transition-duration:.01ms!important;
      }
    }
  </style>
</head>

<body>
<div class="app">
  <div class="top">
    <div class="brand">
      <img class="logo" id="logoImg" src="/logo.png" alt="Logo">
      <div>
        <h1>Gajr AI</h1>
        <p>Matematika va ingliz tili repetitori</p>
      </div>
    </div>

    <div class="creator">
      <div class="who">Muallif<b id="creatorName">oybek</b></div>
      <img class="photo" id="photoImg" src="/photo.png" alt="Muallif">
    </div>
  </div>

  <div class="opts">
    <select id="lang" title="Til va fan">
      <option value="uz-UZ">O'zbekcha (matematika)</option>
      <option value="en-US">English (ingliz tili)</option>
    </select>
    <button type="button" class="chip on" id="voiceBtn">🔊 Ovozli javob</button>
    <button type="button" class="chip" id="convoBtn">🔁 Suhbat rejimi</button>
  </div>

  <div id="log" aria-live="polite">
    <div class="welcome-screen" id="welcomeScreen">
      <img class="galaxy-image" src="/galaxy.png" alt="Gajr AI galaktika shari">
      <h2>Gajr AI — sizning aqlli yordamchingiz</h2>
      <p>
        Men Gajr AI. Matematika va ingliz tilini o‘rganish,
        masalalarni yechish yoki yangi g‘oyalarni kashf
        qilishda yordam beraman.
      </p>
      <div class="welcome-tags">
        <span>✦ Matematika</span>
        <span>✧ Ingliz tili</span>
        <span>⌘ Aqlli yordamchi</span>
      </div>
    </div>
  </div>

  <div id="status" role="status" aria-live="polite"></div>

  <div id="row">
    <input id="text" type="text"
      placeholder="Yozing yoki mikrofonni bosing..."
      autocomplete="off" aria-label="Xabaringiz">
    <button type="button" class="btn" id="mic" title="Gapirish">🎤</button>
    <button type="button" class="btn" id="send" title="Yuborish">➤</button>
  </div>
</div>

<script>
  const LOGO_SRC = "/logo.png";
  const PHOTO_SRC = "/photo.png";
  const CREATOR_NAME = "oybek";

  const log = document.getElementById("log");
  const input = document.getElementById("text");
  const statusEl = document.getElementById("status");
  const micBtn = document.getElementById("mic");
  const langSel = document.getElementById("lang");
  const voiceBtn = document.getElementById("voiceBtn");
  const convoBtn = document.getElementById("convoBtn");

  document.getElementById("logoImg").src = LOGO_SRC;
  document.getElementById("photoImg").src = PHOTO_SRC;
  document.getElementById("creatorName").textContent = CREATOR_NAME;

  document.getElementById("logoImg").onerror = e => e.target.style.display = "none";
  document.getElementById("photoImg").onerror = e => e.target.style.display = "none";

  let messages = [];
  let busy = false;
  let listening = false;
  let voiceOn = true;
  let convoOn = false;
  let rec = null;
  let player = null;
  let speakToken = 0;

  const WELCOME = {
    "uz-UZ": "Salom! Men Gajr AI — matematika bo'yicha repetitoringman. Savolingizni yozing yoki 🎤 ni bosib gapiring.",
    "en-US": "Hi! I'm Gajr AI, your English tutor. Type or press 🎤 and let's talk!"
  };

  function setStatus(text, live = false) {
    statusEl.textContent = text;
    statusEl.className = live ? "live" : "";
  }

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function format(text) {
    return escapeHtml(text)
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/\n/g, "<br>");
  }

  function cleanForSpeech(text, lang) {
    let t = text.replace(/[\*#\`_>]/g, "");
    if (lang.startsWith("uz")) {
      t = t.replace(/=/g, " teng ")
        .replace(/\+/g, " qo'shuv ")
        .replace(/[×\*]/g, " ko'paytirish ")
        .replace(/÷/g, " bo'lish ");
    } else {
      t = t.replace(/=/g, " equals ")
        .replace(/\+/g, " plus ");
    }
    return t.replace(/\s+/g, " ").trim();
  }

  function makeAvatar() {
    const img = document.createElement("img");
    img.className = "avatar";
    img.src = PHOTO_SRC;
    img.alt = "";
    img.onerror = () => {
      const span = document.createElement("div");
      span.className = "avatar";
      span.textContent = "🎓";
      img.replaceWith(span);
    };
    return img;
  }

  function addMsg(cls, text, html = false) {
    const isMe = cls.includes("me");
    const line = document.createElement("div");
    line.className = "line " + (isMe ? "me" : "ai") +
      (cls.includes("typing") ? " typing" : "");

    if (!isMe) line.appendChild(makeAvatar());

    const bubble = document.createElement("div");
    bubble.className = "msg";
    if (html) bubble.innerHTML = format(text);
    else bubble.textContent = text;

    line.appendChild(bubble);
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
    return line;
  }

  function removeWelcome() {
    document.getElementById("welcomeScreen")?.remove();
  }

  function showWelcome() {
    log.innerHTML = `
      <div class="welcome-screen" id="welcomeScreen">
        <img class="galaxy-image" src="/galaxy.png" alt="Gajr AI galaktika shari">
        <h2>Gajr AI — sizning aqlli yordamchingiz</h2>
        <p>
          Men Gajr AI. Matematika va ingliz tilini o‘rganish,
          masalalarni yechish yoki yangi g‘oyalarni kashf
          qilishda yordam beraman.
        </p>
        <div class="welcome-tags">
          <span>✦ Matematika</span>
          <span>✧ Ingliz tili</span>
          <span>⌘ Aqlli yordamchi</span>
        </div>
      </div>`;
  }

  function stopSpeaking() {
    speakToken++;
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    if (player) {
      player.pause();
      player = null;
    }
  }

  function browserSpeak(text, lang, onDone) {
    if (!("speechSynthesis" in window) ||
        !("SpeechSynthesisUtterance" in window)) {
      setStatus("Ovozli o'qish bu brauzerda qo'llanmaydi.");
      if (onDone) onDone();
      return;
    }

    const code = lang.slice(0, 2);
    const voices = speechSynthesis.getVoices();
    const v = voices.find(voice =>
      voice.lang.replace("_", "-").toLowerCase().startsWith(code)
    );

    if (!v && lang.startsWith("uz")) {
      setStatus("Ovoz yaratilmadi, javob faqat matn.");
      if (onDone) onDone();
      return;
    }

    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    if (v) u.voice = v;
    u.onend = () => { setStatus(""); if (onDone) onDone(); };
    u.onerror = () => { setStatus(""); if (onDone) onDone(); };
    speechSynthesis.speak(u);
  }

  async function speak(text, onDone) {
    stopSpeaking();
    const my = speakToken;
    const lang = langSel.value;
    const clean = cleanForSpeech(text, lang);
    setStatus("🔊 Ovoz tayyorlanmoqda...");

    try {
      const r = await fetch("/api/tts", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({text: clean, lang}),
        signal: AbortSignal.timeout(30000)
      });
      if (!r.ok) throw new Error("TTS xatosi");

      const blob = await r.blob();
      if (my !== speakToken) return;

      const url = URL.createObjectURL(blob);
      player = new Audio(url);
      player.onplay = () => setStatus("🔊 Javob o'qilmoqda...");
      player.onended = () => {
        setStatus("");
        URL.revokeObjectURL(url);
        player = null;
        if (onDone) onDone();
      };
      player.onerror = () => {
        setStatus("");
        URL.revokeObjectURL(url);
        player = null;
        if (onDone) onDone();
      };
      await player.play();
    } catch (e) {
      if (my !== speakToken) return;
      console.warn("Server ovozi ishlamadi:", e);
      browserSpeak(clean, lang, onDone);
    }
  }

  async function send(text) {
    text = text.trim();
    if (!text || busy) return;

    removeWelcome();
    stopSpeaking();
    busy = true;
    input.value = "";

    addMsg("me", text);
    messages.push({role: "user", content: text});

    const typing = addMsg(
      "ai typing",
      langSel.value.startsWith("uz") ? "O'ylayapman..." : "Thinking..."
    );

    setStatus("");
    let reply = null;

    try {
      const r = await fetch("/api/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({messages, lang: langSel.value}),
        signal: AbortSignal.timeout(60000)
      });
      if (!r.ok) throw new Error("Server xatosi");
      reply = (await r.json()).reply;
    } catch (e) {
      console.error("Chat xatosi:", e);
      messages.pop();
    }

    typing.remove();
    busy = false;

    if (reply === null || typeof reply !== "string") {
      addMsg("ai", "Xatolik yuz berdi, qayta urinib ko'ring.");
      convoOn = false;
      updateConvoBtn();
      return;
    }

    messages.push({role: "assistant", content: reply});
    addMsg("ai", reply, true);

    if (voiceOn) speak(reply, afterReply);
    else afterReply();
  }

  function afterReply() {
    if (convoOn) startListening();
  }

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  function startListening() {
    if (!SR) {
      alert("Brauzeringiz ovozni qo'llamaydi. Chrome yoki Edge ishlating.");
      return;
    }
    if (listening || busy) return;

    stopSpeaking();
    rec = new SR();
    rec.lang = langSel.value;
    rec.interimResults = true;
    rec.continuous = false;

    let gotFinal = false;

    rec.onstart = () => {
      listening = true;
      micBtn.classList.add("rec");
      setStatus("🎤 Tinglayapman... gapiring", true);
    };

    rec.onresult = e => {
      let t = "";
      for (const r of e.results) t += r[0].transcript;
      input.value = t;

      if (e.results[e.results.length - 1].isFinal) {
        gotFinal = true;
        send(t);
      }
    };

    rec.onerror = e => {
      if (e.error === "not-allowed") {
        setStatus("Mikrofonga ruxsat bering (manzil qatoridagi 🔒 belgisi).");
      } else if (e.error === "no-speech") {
        setStatus("Ovoz eshitilmadi. Qayta urinib ko'ring.");
      } else {
        setStatus("Mikrofon xatosi: " + e.error);
      }
      convoOn = false;
      updateConvoBtn();
    };

    rec.onend = () => {
      listening = false;
      micBtn.classList.remove("rec");
      if (!gotFinal && statusEl.className === "live") setStatus("");
    };

    try {
      rec.start();
    } catch (e) {
      listening = false;
      micBtn.classList.remove("rec");
      setStatus("Mikrofonni qayta ishga tushirib ko'ring.");
    }
  }

  function stopListening() {
    if (rec && listening) rec.stop();
  }

  document.getElementById("send").onclick = () => send(input.value);
  input.onkeydown = e => {
    if (e.key === "Enter") send(input.value);
  };

  micBtn.onclick = () => {
    if (listening) {
      convoOn = false;
      updateConvoBtn();
      stopListening();
    } else {
      startListening();
    }
  };

  voiceBtn.onclick = () => {
    voiceOn = !voiceOn;
    voiceBtn.classList.toggle("on", voiceOn);
    voiceBtn.textContent = voiceOn ? "🔊 Ovozli javob" : "🔇 Ovozsiz";
    if (!voiceOn) {
      stopSpeaking();
      setStatus("");
    }
  };

  function updateConvoBtn() {
    convoBtn.classList.toggle("on", convoOn);
  }

  convoBtn.onclick = () => {
    convoOn = !convoOn;
    updateConvoBtn();

    if (convoOn) {
      voiceOn = true;
      voiceBtn.classList.add("on");
      voiceBtn.textContent = "🔊 Ovozli javob";
      startListening();
    } else {
      stopListening();
      stopSpeaking();
      setStatus("");
    }
  };

  langSel.onchange = () => {
    stopSpeaking();
    stopListening();
    convoOn = false;
    updateConvoBtn();
    messages = [];
    showWelcome();
    setStatus("");
  };
</script>
</body>
</html>
